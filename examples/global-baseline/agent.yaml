schema: 1
name: global-baseline
description: Stable cross-project defaults for coding-agent work
canonical:
  source: AGENTS.md
files:
  - source: AGENTS.md
    targets:
      - scope: global
        agent: codex
        path: AGENTS.md
        mode: direct
      - scope: global
        agent: claude-code
        path: AGENTS.md
        mode: direct
      - scope: global
        agent: claude-code
        path: CLAUDE.md
        mode: import
        import: AGENTS.md
